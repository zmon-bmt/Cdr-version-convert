[package]
name = "cdr_converter"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
